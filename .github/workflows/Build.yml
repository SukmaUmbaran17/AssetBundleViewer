name: Ambil File Aktivasi Unity

on:
  workflow_dispatch: # Biar bisa diklik manual lewat HP

jobs:
  suntik-lisensi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request File ALF
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          # Perintah khusus untuk memicu pembuatan file lisensi baru
          versioning: None
