name: Build Unity Viewer Module

on:
  workflow_dispatch: # Memicu tombol "Run workflow" manual di GitHub Actions

jobs:
  build-unity:
    name: Export Unity Project to Android Library
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode dari Repositori Hasil Fork secara eksplisit
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master        # Memastikan mengambil branch master bawaan repo aslinya
          fetch-depth: 0

      # 2. Langkah Pembersihan & Debug Jalur Kerja Server
      - name: Verify Project Structure
        run: |
          echo "Current Workspace Path: $GITHUB_WORKSPACE"
          ls -la $GITHUB_WORKSPACE
          if [ -f "$GITHUB_WORKSPACE/ProjectSettings/ProjectVersion.txt" ]; then
            echo "ProjectVersion.txt FOUND!"
            cat "$GITHUB_WORKSPACE/ProjectSettings/ProjectVersion.txt"
          else
            echo "ProjectVersion.txt NOT FOUND AT ROOT!"
          fi

      # 3. Jalankan Compiler Game-CI Unity dengan Absolut Workspace Path
      - name: Build Unity Module
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          # PERBAIKAN UTAMA: Menggunakan variabel lingkungan absolut dari runner GitHub
          projectPath: ${{ github.workspace }}
          androidExportType: androidStudioProject 

      # 4. Ambil Folder Hasil Build (unityLibrary) dan simpan sebagai Artifacts
      - name: Upload Unity Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-library-output
          path: build/Android
