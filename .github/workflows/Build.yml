name: Build Unity Viewer Module

on:
  workflow_dispatch: # Memicu tombol "Run workflow" manual di GitHub Actions

jobs:
  build-unity:
    name: Export Unity Project to Android Library
    runs-on: ubuntu-latest
    steps:
      # 1. PERBAIKAN RADIKAL: Unduh kode dengan mendefinisikan branch 'master' secara absolut
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 'master'       # Menegaskan server untuk mengunduh dari branch master bawaan repo Fork
          fetch-depth: 1      # Mengunduh salinan segar agar file ProjectSettings langsung terbaca

      # 2. JALANKAN COMPILER GAME-CI UNITY (VERSI RESET PARAMETER)
      - name: Build Unity Module
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidStudioProject 
          # Kunci Solusi: Memberikan string kosong pada projectPath memaksa Docker internal 
          # Game-CI memetakan folder root utama ($GITHUB_WORKSPACE) tanpa membuat folder bayangan.
          projectPath: "" 

      # 3. Ambil Folder Hasil Build (unityLibrary) dan simpan sebagai Artifacts
      - name: Upload Unity Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-library-output
          path: build/Android
