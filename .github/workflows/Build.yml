name: Build Final Modding Tools APK

on:
  workflow_dispatch: # Memicu tombol manual dari browser HP

jobs:
  build-unity:
    name: Export Unity Project to Android Library
    runs-on: ubuntu-latest
    steps:
      # 1. Unduh repositori secara mendalam dari branch master hasil Fork
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # 2. TRIK AMAN: Paksa buat folder dan file versi Unity agar Docker tidak tersesat
      - name: Force Fix ProjectSettings Directory
        run: |
          echo "Memperbaiki perizinan sistem dan menyuntikkan file identitas Unity..."
          chmod -R 777 .
          mkdir -p ProjectSettings
          if [ -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "ProjectVersion.txt sudah ada secara fisik."
          else
            echo "m_EditorVersion: 2021.3.0f1" > ProjectSettings/ProjectVersion.txt
          fi

      # 3. JALANKAN TRICK MEMINTA FILE .ALF (Sengaja digagalkan untuk lisensi)
      - name: Export Unity to Android Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidStudioProject
          allowDirtyBuild: true
          # KUNCI UTAMA: Parameter ini memaksa Unity membatalkan build 
          # dan langsung memuntahkan file request .alf ke folder artifacts
          versioning: None 

      # 4. AMBIL FILE .ALF DAN KLASIFIKASIKAN JADI ARTIFACTS (Hanya berjalan jika langkah 3 selesai/gagal)
      - name: Upload Unity Activation File (.alf)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: |
            *.alf
            build/**/*.alf
