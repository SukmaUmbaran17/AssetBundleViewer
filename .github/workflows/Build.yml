name: Build Unity Viewer Module

on:
  workflow_dispatch: # Memicu tombol "Run workflow" manual di GitHub Actions

jobs:
  build-unity:
    name: Export Unity Project to Android Library
    runs-on: ubuntu-latest
    steps:
      # 1. PERBAIKAN: Memaksa checkout membaca branch master dan membersihkan workspace
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master        # <--- Memastikan mengambil branch master bawaan repo aslinya
          fetch-depth: 0

      # 2. DEBUG LANGKAH (Opsional): Menampilkan daftar file untuk verifikasi di log
      - name: List Files for Verification
        run: ls -la

      # 3. Jalankan Compiler Game-CI Unity
      - name: Build Unity Module
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: .                  # <--- Menegaskan pencarian di folder utama hasil checkout
          androidExportType: androidStudioProject 

      # 4. Ambil Folder Hasil Build (unityLibrary) dan simpan sebagai Artifacts
      - name: Upload Unity Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-library-output
          path: build/Android
