name: Build Unity Viewer Module

on:
  workflow_dispatch: # Memicu tombol "Run workflow" manual di GitHub Actions

jobs:
  build-unity:
    name: Export Unity Project to Android Library
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode dari Repositori Hasil Fork
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Jalankan Compiler Game-CI Unity
      - name: Build Unity Module
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          # PERBAIKAN 1: Mengubah path ke root (titik ".") karena ProjectSettings ada di halaman utama repo Fork
          projectPath: . 
          # PERBAIKAN 2: Menggunakan format input v4 yang valid untuk mengekspor sebagai proyek Android Studio (.aar/Gradle)
          androidExportType: androidCreateProject 

      # 3. Ambil Folder Hasil Build (unityLibrary) dan simpan sebagai Artifacts
      - name: Upload Unity Library Artifact
        uses: actions/artifacts-upload@v4
        with:
          name: unity-library-output
          path: build/Android
